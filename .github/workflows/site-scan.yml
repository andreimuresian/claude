name: Scan builder websites

on:
  push:
    branches: [claude/ucimu-scraper]
    paths:
      - 'ucimu_scraper/site_scan.py'
      - 'ucimu_scraper/builders.json'
      - '.github/workflows/site-scan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Run scan
        working-directory: ucimu_scraper
        run: python site_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-scan-out
          path: ucimu_scraper/out_site
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ucimu_scraper/out_site
          git commit -m "Add website scan results" || exit 0
          git pull --rebase origin claude/ucimu-scraper
          git push
