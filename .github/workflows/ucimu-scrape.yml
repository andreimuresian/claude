name: Scrape UCIMU members

on:
  push:
    branches: [claude/ucimu-scraper]
    paths:
      - 'ucimu_scraper/**'
      - '.github/workflows/ucimu-scrape.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Run scraper
        working-directory: ucimu_scraper
        run: python ucimu_scrape.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ucimu-out
          path: ucimu_scraper/out
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ucimu_scraper/out
          git commit -m "Add scraped UCIMU data" || exit 0
          git push
